<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | E-Commerce Demo</title>
  <meta name="description" content="Explore E-Commerce Demo product details, sizes, colors, and features.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body class="product-page">
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.4 12.1a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="21" r="1.4" fill="currentColor"/><circle cx="18" cy="21" r="1.4" fill="currentColor"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html#home" class="logo" aria-label="E-Commerce Demo — Home">E-COMMERCE<span> DEMO</span></a>
      <nav class="nav-menu" id="navMenu">
        <a href="index.html#shop">Shop All</a><a href="index.html#featured">New Drops</a><a href="index.html#categories">Categories</a><a href="index.html#why">Our Story</a><a href="index.html#contact">Contact</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="cartBtn" aria-label="Cart" aria-expanded="false" aria-controls="cartPanel"><svg class="ic"><use href="#icon-cart"/></svg><span class="cart-count" id="cartCount">0</span></button>
        <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false" aria-controls="navMenu"><svg class="ic" id="menuIcon"><use href="#icon-menu"/></svg></button>
      </div>
    </div>
  </header>

  <aside class="cart-panel" id="cartPanel" aria-label="Shopping cart" aria-hidden="true">
    <div class="cart-panel-head"><h2>Your Cart</h2><button class="icon-btn" id="closeCart" aria-label="Close cart"><svg class="ic"><use href="#icon-close"/></svg></button></div>
    <div class="cart-items" id="cartItems"></div>
    <p class="cart-empty" id="cartEmpty">Your cart is empty. Add a fit to get started.</p>
    <div class="cart-summary"><span>Subtotal</span><strong id="cartSubtotal">₹0</strong></div>
    <button class="btn btn-primary cart-checkout" id="checkoutBtn" type="button" aria-describedby="checkoutMsg">Checkout</button>
    <p class="cart-checkout-msg" id="checkoutMsg" aria-live="polite"></p>
  </aside>
  <div class="cart-backdrop" id="cartBackdrop" hidden></div>

  <main id="productPage"></main>

  <script src="logger.js"></script>
  <script src="admin-config.js"></script>
  <script src="mock-data.js"></script>
  <script src="auth.js"></script>
  <script src="products.js"></script>
  <script src="cart.js"></script>
  <script src="product.js"></script>
</body>
</html>
